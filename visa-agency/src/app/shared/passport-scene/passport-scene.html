<svg class="scene" appTilt viewBox="0 0 440 500" role="img" [attr.aria-label]="label()">
    <defs>
        <!-- Light band that sweeps across the cover (moved by the hero animation) -->
        <linearGradient id="ps-sheen-fill" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="0" />
            <stop offset="0.5" stop-color="#fff" stop-opacity="0.28" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </linearGradient>
        <clipPath id="ps-cover-clip">
            <rect x="80" y="40" width="280" height="390" rx="18" />
        </clipPath>
    </defs>

    <ellipse class="ground" cx="232" cy="470" rx="140" ry="12" filter="url(#et-blur)" />

    <g class="passport">
        <!-- Ribbon bookmark, tucked between the pages -->
        <path class="ribbon" d="M292 400 h18 v78 l-9 -10 l-9 10 z" />

        <!-- Page block peeking out on the right and bottom gives the book its thickness -->
        <rect class="pages" x="90" y="47" width="276" height="388" rx="16" />
        <path class="page-lines" d="M360 70 V410 M363 76 V404 M110 433 H340" />

        <!-- Cover -->
        <rect class="cover" x="80" y="40" width="280" height="390" rx="18" />
        <rect x="80" y="40" width="280" height="390" rx="18" fill="#fff" filter="url(#et-grain)" />
        <rect class="spine" x="80" y="40" width="18" height="390" rx="9" />
        <path class="spine-edge" d="M98 52 V418" />

        <!-- Gold-foil decoration -->
        <g class="foil">
            <rect class="frame" x="110" y="62" width="234" height="346" rx="10" />
            <rect class="frame thin" x="117" y="69" width="220" height="332" rx="7" />

            <text class="title" x="227" y="118" text-anchor="middle">PASAPORTE</text>
            <text class="sub" x="227" y="140" text-anchor="middle">PASSPORT</text>

            <g class="crest" transform="translate(227 240)">
                @for (leaf of leaves; track $index) {
                    <ellipse class="leaf" rx="7" ry="3" [attr.transform]="leaf" />
                }
                <circle class="ring" r="52" />
                <circle class="ring thin" r="45" />
                <!-- The agency's own mark (same drawing as the logo), not any government seal -->
                <g class="mark" transform="translate(-34 -34) scale(1.06)">
                    <path d="M15 27 A21 21 0 1 0 52 45" />
                    <path d="M17 33 Q 22 17 39 12" />
                    <path class="fill" d="M36 6.5 L45 10.5 L38.5 17.5 Z" />
                    <path class="check" d="M22 35 L31 46 L57 15" />
                </g>
            </g>

            <text class="name" x="227" y="338" text-anchor="middle">EASYTRAVEL VISA</text>

            <!-- e-passport chip symbol -->
            <g class="chip" transform="translate(209 360)">
                <rect width="36" height="22" rx="4" />
                <circle cx="18" cy="11" r="5" />
                <path d="M0 11 H13 M23 11 H36" />
            </g>
        </g>

        <g clip-path="url(#ps-cover-clip)">
            <rect class="sheen" x="-60" y="20" width="120" height="440" fill="url(#ps-sheen-fill)" transform="skewX(-18)" />
        </g>
    </g>
</svg>
