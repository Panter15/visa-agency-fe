<h3 class="board-title">{{ t().about.valuesTitle }}</h3>
<ul class="board">
    @for (value of t().about.values; track value.title) {
        <li class="value">
            <span class="value-icon"><app-icon [name]="value.icon" /></span>
            <div>
                <p class="value-title">{{ value.title }}</p>
                <p class="value-text">{{ value.text }}</p>
            </div>
        </li>
    }
</ul>
