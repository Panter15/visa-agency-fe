<h3 class="board-title">{{ t().about.valuesTitle }}</h3>
<ul class="board">
    @for (value of t().about.values; track value.title; let i = $index) {
        <!-- Each value as an entry stamp, in the same blue ink as the passport's ADMITIDO stamp -->
        <li class="stamp">
            <span class="stamp-no" aria-hidden="true">Nº {{ (i + 1).toString().padStart(2, '0') }}</span>
            <p class="stamp-title">{{ value.title }}</p>
            <p class="stamp-text">{{ value.text }}</p>
        </li>
    }
</ul>
