<section id="about" class="about-section">
    <div class="head">
        <h2 class="section-title title" [appWords]="t().about.title"></h2>
    </div>
    <div class="body">
        <p class="lead">{{ t().about.lead }}</p>
        <p class="text">{{ t().about.body }}</p>
    </div>
    <img class="visual photo" src="images/about-stamps.webp" width="1000" height="667" loading="lazy" [alt]="t().about.visual" />
</section>
