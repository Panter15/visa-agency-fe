<footer class="site-footer">
    <app-logo class="brand inverse" [tagline]="true" />
    <div class="contact">
        <a class="social" appWhatsappGate [href]="i18n.whatsappUrl()" target="_blank" rel="noopener" aria-label="WhatsApp"><app-icon name="whatsapp" /></a>
        <a class="social" [href]="facebookUrl" target="_blank" rel="noopener" aria-label="Facebook"><app-icon name="facebook" /></a>
        <a class="social" [href]="instagramUrl" target="_blank" rel="noopener" aria-label="Instagram"><app-icon name="instagram" /></a>
    </div>
    <nav class="legal-links" aria-label="Legal">
        <a routerLink="/privacidad">{{ t().footer.privacy }}</a>
        <a routerLink="/terminos">{{ t().footer.terms }}</a>
        <a routerLink="/reembolsos">{{ t().footer.refund }}</a>
    </nav>
    <p class="disclaimer">{{ t().footer.disclaimer }}</p>
    <p class="legal">&copy; {{ year }} Easytravel Visa. {{ t().footer.rights }}</p>
</footer>
