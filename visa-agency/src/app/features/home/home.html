<section id="home" class="home-section">
    <div class="copy">
        <h1 class="headline" [appWords]="t().hero.title"></h1>
        <div class="intro">
            <p class="subtext">{{ t().hero.text }}</p>
            <a class="btn cta" appWhatsappGate [href]="i18n.whatsappUrl()" target="_blank" rel="noopener">
                <app-icon class="btn-icon" name="chat" />{{ t().hero.cta }} <span class="btn-arrow" aria-hidden="true">→</span>
            </a>
        </div>
    </div>
    <img class="visual photo" src="images/hero-window.webp" width="960" height="1438" fetchpriority="high" [alt]="t().hero.visual" />
    <div class="scroll-hint" aria-hidden="true"><span></span></div>
</section>
