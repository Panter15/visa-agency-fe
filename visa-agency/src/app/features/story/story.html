<section class="story-section">
    <div class="lines">
        @for (line of t().story.lines; track $index) {
            <p class="line" [class.last]="$last">
                @for (word of line.split(' '); track $index) {<span class="w">{{ word }}</span>{{ ' ' }}}
            </p>
        }
    </div>

    <!-- Follows the lines: form full of "?" → midnight → nerves → everything checked, with you -->
    <div class="visual">
        <svg appTilt="10" viewBox="0 0 400 475" role="img" [attr.aria-label]="t().story.visual">
            <g class="night">
                <circle class="moon" cx="338" cy="52" r="22" />
                <circle class="moon-cut" cx="348" cy="44" r="19" />
                <circle class="star" cx="300" cy="30" r="2" />
                <circle class="star" cx="372" cy="92" r="1.6" />
                <circle class="star" cx="288" cy="70" r="1.3" />
            </g>

            <ellipse class="ground" cx="182" cy="428" rx="130" ry="9" filter="url(#et-blur)" />

            <g class="sheet">
                <!-- Two sheets underneath give the form a little stack of depth -->
                <rect class="paper under" x="62" y="70" width="260" height="352" rx="14" transform="rotate(3 192 246)" />
                <rect class="paper under" x="56" y="66" width="260" height="352" rx="14" transform="rotate(1.4 186 242)" />
                <rect class="paper" x="50" y="60" width="260" height="352" rx="14" />
                <!-- Security-paper watermark, as on official forms -->
                <path class="watermark" d="M50 250 Q 115 210 180 245 T 310 235 M50 268 Q 115 228 180 263 T 310 253 M50 286 Q 115 246 180 281 T 310 271" />
                <!-- Navy header with gold lettering, like the passports -->
                <path class="header" d="M50 118 V74 a14 14 0 0 1 14 -14 H296 a14 14 0 0 1 14 14 V118 Z" />
                <line class="header-rule" x1="50" y1="119" x2="310" y2="119" />
                <text class="form-title" x="74" y="98">DS-160</text>
                <text class="form-sub" x="74" y="110">FORMULARIO</text>
                @for (row of [0, 1, 2, 3]; track row) {
                    <g [attr.transform]="'translate(0 ' + (136 + row * 50) + ')'">
                        <rect class="label" x="74" y="0" width="70" height="6" rx="3" />
                        <rect class="input" x="74" y="14" width="170" height="24" rx="6" />
                        <rect class="fill" x="82" y="23" [attr.width]="[120, 90, 135, 70][row]" height="6" rx="3" />
                        <g class="q" transform="translate(276 26)">
                            <circle r="12" />
                            <text y="5" text-anchor="middle">?</text>
                        </g>
                        <g class="ok" transform="translate(276 26)">
                            <circle r="12" />
                            <path d="M-5 0 L-1.5 4 L5.5 -4.5" />
                        </g>
                    </g>
                }

                <!-- Sign-off: the form ends reviewed and signed together -->
                <line class="divider" x1="74" y1="340" x2="286" y2="340" />
                <path class="signature" pathLength="1"
                      d="M78 372 c4 -16 10 -22 13 -14 s-5 18 1 14 s9 -20 14 -14 s-3 14 3 12 s8 -12 12 -9 s-1 9 5 7 s9 -8 14 -6 s4 6 10 4 s12 -6 26 -8" />
                <line class="sign-line" x1="74" y1="380" x2="222" y2="380" />
                <text class="sign-label" x="74" y="396">{{ t().story.signed }}</text>
                <g class="seal" transform="translate(270 360) rotate(-12)">
                    <circle class="seal-ring" r="25" />
                    <circle class="seal-ring thin" r="19.5" />
                    <path d="M-8 0 L-2.5 6 L9 -7" />
                </g>
            </g>

            <path class="pulse" pathLength="1" d="M20 452 H110 l8 -16 l10 30 l10 -36 l10 28 l8 -6 H380" />
        </svg>
    </div>
</section>
