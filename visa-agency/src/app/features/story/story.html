<section class="story-section">
    <div class="lines">
        @for (line of t().story.lines; track $index) {
            <p class="line" [class.last]="$last">
                @for (word of line.split(' '); track $index) {<span class="w">{{ word }}</span>{{ ' ' }}}
            </p>
        }
    </div>

    <img class="visual photo" src="images/story-night.webp" width="900" height="1100" loading="lazy" [alt]="t().story.visual" />
</section>
